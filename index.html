<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>CLAIM BONUS FREESPIN</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background: url("bg/gambar22.jpg") center/cover no-repeat fixed;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 16px;
    color:#fff;
}

/* CONTAINER */
.container{
    width:100%;
    max-width:1100px;
	min-height:calc(100vh + 200px);
}

/* TITLE */
.title{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
	font-family:'Orbitron',sans-serif;
    font-size:34px;
    font-weight:800;
    color:#ffffff;
    letter-spacing:2px;
    text-align:center;
    margin-bottom:2px;
    font-family:'Orbitron',sans-serif;

    text-shadow:
        0 0 10px rgba(59,130,246,0.25);
}

.title-logo{
    width:55px;
    height:55px;
}

/* MAIN BOX (GLASS STYLE) */
.main-box{
    background: rgba(0,0,0,0.25);
    border:1px solid rgba(96,165,250,0.25);
    border-radius:18px;
    padding:22px;
	margin-top:30px;
    backdrop-filter: blur(10px);
    box-shadow:
        0 15px 45px rgba(0,0,0,0.55),
        0 0 35px rgba(56,189,248,0.12);
}

/* INPUT */
.input-area{
    width:100%;
    min-height:170px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,0.12);
    background: rgba(0,0,0,0.25);
    padding:14px;
    font-size:14px;
    color:#fff;
    outline:none;
    resize:vertical;
    margin-bottom:18px;
}

.input-area:focus{
    border-color:#60a5fa;
    box-shadow:0 0 0 3px rgba(96,165,250,0.15);
}

/* TABLE WRAPPER */
.table-wrapper{
    overflow:hidden;
    border-radius:14px;
    border:1px solid rgba(255,255,255,0.08);
}

/* TABLE */
table{
    width:100%;
    border-collapse:collapse;
    background:#ffffff;
}

/* HEADER */
th{
    background: url("bg/gambar22.jpg") center/cover no-repeat fixed;
    color:#dbeafe;
    padding:14px 10px;
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    border-right:1px solid rgba(255,255,255,0.05);
    box-shadow: inset 0 -1px 0 rgba(96,165,250,0.2);
}

th:last-child{
    border-right:none;
}

/* ROW */
tbody tr{
    transition:0.2s;
}

tbody tr:nth-child(even){
    background:#fafafa;
}

tbody tr:hover{
    background:rgba(59,130,246,0.06);
}

/* CELL */
td{
    background:#fff;
    color:#111827;
    padding:10px;
    border-bottom:1px solid rgba(0,0,0,0.06);
}

/* INPUT / SELECT */
td input,
td select{
    width:100%;
    background:#f9fafb;
    color:#0f172a;
    border:1px solid rgba(59,130,246,0.15);
    border-radius:10px;
    padding:8px;
    font-size:13px;
    outline:none;
    transition:0.2s;
}

td input:focus,
td select:focus{
    border-color:#60a5fa;
    box-shadow:0 0 0 3px rgba(59,130,246,0.12);
}

/* 🔥 KOLOM TOTAL MENANG (HALUS & PREMIUM) */
td:nth-child(7){
    background:#f1f5f9;
    font-weight:800;
    color:#0f172a;
    position:relative;
    box-shadow: inset 0 0 0 1px rgba(56,189,248,0.12);
}

/* garis kecil HALUS di atas saja (bukan full kiri) */
td:nth-child(7)::before{
    content:"";
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%);
    width:60%;
    height:2px;
    background:rgba(56,189,248,0.35);
    border-radius:2px;
}

/* BUTTON */
.copy-btn{
    width:100%;
    height:52px;
    margin-top:16px;
    border:none;
    border-radius:14px;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
    color:white;

    background: linear-gradient(135deg,#2563eb,#06b6d4);
    box-shadow:0 10px 25px rgba(37,99,235,0.35);

    position:relative;
    overflow:hidden;
    transition:0.2s;
}

.copy-btn:hover{
    transform:translateY(-2px);
}

/* shine */
.copy-btn::before{
    content:"";
    position:absolute;
    top:0;
    left:-75%;
    width:50px;
    height:100%;
    background:linear-gradient(120deg,transparent,rgba(255,255,255,0.4),transparent);
    transform:skewX(-20deg);
    animation:shine 3s infinite;
}

@keyframes shine{
    0%{left:-75%}
    100%{left:130%}
}

/* SUCCESS */
.copy-btn.success{
    background: linear-gradient(135deg,#16a34a,#22c55e);
}

/* BRAND */
.brand{
    margin-top:14px;

    display:block;
    width:fit-content;

    margin-left:auto;
    margin-right:auto;

    font-size:9px;

    font-weight:600;
    letter-spacing:0.6px;

    color:rgba(255,255,255,0.9);

    padding:2px 6px;   

    border-radius:6px;

    border:1px solid rgba(96,165,250,0.25);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow:0 6px 18px rgba(0,0,0,0.2);
	text-shadow:
    0 1px 2px rgba(0,0,0,0.8),
    0 0 8px rgba(255,255,255,0.15);
}
</style>
</head>

<body>

<div class="container">

    <div class="title">
	<img src="bg/gambar3.jpg" alt="Logo" class="title-logo">
        BONUS FREESPIN
    </div>


    <div class="main-box">

        <textarea class="input-area" placeholder="Masukkan Data . . ."></textarea>

        <div class="table-wrapper">

            <table>

<colgroup>
    <col style="width:120px;">
    <col style="width:130px;">
    <col style="width:150px;">
    <col style="width:140px;">
    <col style="width:180px;">
    <col style="width:120px;">
    <col style="width:160px;">
    <col style="width:140px;">
    <col style="width:140px;">
    <col style="width:160px;">
</colgroup>

                <thead>
<tr>
    <th>TANGGAL</th>
    <th>OPERATOR</th>
    <th>USERNAME</th>
    <th>PROVIDER</th>
    <th>GAME</th>
    <th>PERIODE</th>
    <th>TOTAL MENANG</th>
    <th>BET SPIN</th>
    <th>MODE SPIN</th>
    <th>SALDO AWAL</th>
</tr>
</thead>

<tbody>
<tr>

    <td><input type="text"></td>

    <td>
        <select>
            <option value="">Pilih</option>
            <option value="YOGI">YOGI</option>
            <option value="TAUFAN">TAUFAN</option>
            <option value="JOSUA">JOSUA</option>
            <option value="YADI">YADI</option>
            <option value="PUTRI">PUTRI</option>
        </select>
    </td>

    <td><input type="text"></td>

    <td><input type="text"></td>

    <td><input type="text"></td>

    <td><input type="text"></td>

    <!-- TOTAL MENANG (auto script kamu) -->
    <td><input type="text" readonly></td>

    <!-- BET SPIN -->
    <td>
        <input type="text" class="bet-spin" placeholder="Nominal">
    </td>

    <!-- MODE SPIN -->
    <td>
        <select>
            <option value="">Pilih</option>
            <option value="Buy Spin">BUY SPIN</option>
            <option value="Murni">MURNI</option>
        </select>
    </td>

    <!-- SALDO AWAL -->
    <td>
        <input type="text" placeholder="Nominal">
    </td>

</tr>
</tbody>

            </table>

        </div>

        <button class="copy-btn">
            COPY DATA
        </button>

    </div>
	

<div class="brand">
    © 2026 | BY YOGIK
	
</div>

</div>
<script>

const copyBtn = document.querySelector('.copy-btn');

copyBtn.addEventListener('click', async ()=>{

    const row = document.querySelector('tbody tr');
    const cells = row.querySelectorAll('td');

    const tanggal = cells[0].querySelector('input').value;
    const operator = cells[1].querySelector('select').value;
    const username = cells[2].querySelector('input').value;
    const provider = cells[3].querySelector('input').value;
    const game = cells[4].querySelector('input').value;
    const periode = cells[5].querySelector('input').value;
    const total = cells[6].querySelector('input').value;

    const bet = cells[7].querySelector('input').value;

    const mode = cells[8].querySelector('select').value.toUpperCase();

    const saldoAwal = '';

    const cleanTotal = total.replace(/,/g,'');
    const cleanBet = bet.replace(/,/g,'');
    const cleanSaldo = saldoAwal.replace(/,/g,'');

    const textRow =
    tanggal + '\t' +
    operator + '\t' +
    username + '\t' +
    provider + '\t' +
    game + '\t' +
    periode + '\t' +
    cleanTotal + '\t' +
    cleanBet + '\t' +
    mode;

    try {

        await navigator.clipboard.writeText(textRow);

        copyBtn.innerText = 'COPIED ✓';

copyBtn.classList.add('success');

setTimeout(()=>{

    copyBtn.innerText = 'COPY DATA';

    copyBtn.classList.remove('success');

},2000);

    } catch(err){

        alert('Copy gagal');

    }

});

</script>

<script>

const textarea = document.querySelector('.input-area');

textarea.addEventListener('input', function(){

    const lines = this.value.split('\n').map(l => l.trim()).filter(Boolean);

    if(lines.length < 10) return;

    const game = lines[0];
    const provider = lines[1];

    const periode = lines[2].split('-')[0].trim();

    const username = lines[4];

    const operator = lines[5]
        ? lines[5].split('-')[0].trim()
        : '';

    const tanggal = lines[6].split('-')[0].trim();

    const betSpin = (lines[8] || '')
        .replace(/[^0-9.]/g,'')
        .split('.')[0]
        .replace(/\B(?=(\d{3})+(?!\d))/g, ',');

    const modeSpin = (lines[7] || '').trim();

    const balanceLine = lines[9] || '';

    const match = balanceLine.match(/[\d,.]+/);

    let balanceAkhir = 0;

    if(match){

        balanceAkhir = parseInt(
            match[0]
            .replace(/,/g,'')
            .split('.')[0]
        );

    }

    const row = document.querySelector('tbody tr');

    const cells = row.querySelectorAll('td');

    cells[0].querySelector('input').value = tanggal;
    cells[1].querySelector('select').value = operator;
    cells[2].querySelector('input').value = username;
    cells[3].querySelector('input').value = provider;
    cells[4].querySelector('input').value = game;
    cells[5].querySelector('input').value = periode;

    // TOTAL MENANG kosong dulu
    cells[6].querySelector('input').value = '';

    cells[7].querySelector('input').value = '';

    cells[8].querySelector('select').value = modeSpin;
	cells[9].querySelector('input').value = '';

    // simpan balance akhir
    cells[6].querySelector('input').dataset.balance = balanceAkhir;

});


// AUTO HITUNG TOTAL MENANG
const saldoInput = document.querySelectorAll('tbody tr td input')[7];

saldoInput.addEventListener('input', function(){

    const row = document.querySelector('tbody tr');
    const cells = row.querySelectorAll('td');

    const totalCell = cells[6].querySelector('input');

    const balanceAkhir = parseInt(
        totalCell.dataset.balance || 0
    );

    const saldoAwal = parseInt(
        this.value.replace(/,/g,'') || 0
    );

    const hasil = balanceAkhir - saldoAwal;

    totalCell.value = hasil > 0
        ? hasil.toLocaleString('en-US')
        : '';

});
</script>

<!-- 🔥 TAMBAHKAN SCRIPT BARU DI SINI (MASIH DALAM BODY) -->
<script>
const saldoAwalInput = document.querySelector('tbody tr td:last-child input');

saldoAwalInput.addEventListener('input', function () {
    let value = this.value.replace(/,/g, '').replace(/[^0-9]/g, '');

    if (!value) {
        this.value = '';
        return;
    }

    this.value = value.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
});
</script>

<script>
function formatRibuan(input) {
    let value = input.value.replace(/,/g, '').replace(/[^0-9]/g, '');

    if (!value) {
        input.value = '';
        return;
    }

    input.value = value.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

document.addEventListener('DOMContentLoaded', function () {

    // BET SPIN saja (pakai class biar pasti benar)
    const betSpinInput = document.querySelector('.bet-spin');

    if (betSpinInput) {
        betSpinInput.addEventListener('input', function () {
            formatRibuan(this);
        });
    }

});
</script>

</body>
</html>
